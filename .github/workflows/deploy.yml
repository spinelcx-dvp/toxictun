name: Xray-VLESS-Panel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq unzip python3-pip
        pip3 install flask

    - name: Install Xray
      run: |
        wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
        unzip -q Xray-linux-64.zip
        chmod +x xray
        sudo mv xray /usr/local/bin/
        xray version

    - name: Install Cloudflared
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
        chmod +x cloudflared
        sudo mv cloudflared /usr/local/bin/
        cloudflared --version

    - name: Create Xray Config
      run: |
        mkdir -p /tmp/xray
        cat > /tmp/xray/config.json << 'EOF'
        {
          "log": {"loglevel": "warning"},
          "inbounds": [{
            "port": 8080,
            "listen": "127.0.0.1",
            "protocol": "vless",
            "settings": {
              "clients": [{"id": "d342d11e-d424-4583-b36e-524ab1f0afa4"}],
              "decryption": "none"
            },
            "streamSettings": {
              "network": "ws",
              "wsSettings": {"path": "/vless"}
            }
          }],
          "outbounds": [{"protocol": "freedom"}]
        }
        EOF
        cat /tmp/xray/config.json

    - name: Start Xray
      run: |
        nohup xray run -c /tmp/xray/config.json > /tmp/xray.log 2>&1 &
        sleep 3
        cat /tmp/xray.log || true
        ps aux | grep xray | grep -v grep

    - name: Start Panel and Tunnels
      run: |
        nohup python3 panel.py > /tmp/panel.log 2>&1 &
        sleep 3
        
        nohup cloudflared tunnel --url http://localhost:5000 --no-autoupdate > /tmp/panel_tunnel.log 2>&1 &
        nohup cloudflared tunnel --url http://localhost:8080 --no-autoupdate > /tmp/xray_tunnel.log 2>&1 &
        
        echo "Waiting for tunnels to be ready..."
        sleep 25
        
        echo "=========== PANEL TUNNEL URL ==========="
        grep -o 'https://[^ ]*trycloudflare.com' /tmp/panel_tunnel.log | head -1 || echo "Panel tunnel not ready"
        echo "========================================"
        echo ""
        echo "=========== XRAY TUNNEL URL ==========="
        grep -o 'https://[^ ]*trycloudflare.com' /tmp/xray_tunnel.log | head -1 || echo "Xray tunnel not ready"
        echo "========================================"
        
        echo ""
        echo ">>> Open the PANEL URL in your browser to see the config <<<"
        echo ""
        
        # Keep the job alive for the maximum duration
        tail -f /dev/null
